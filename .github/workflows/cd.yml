name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build JAR with Gradle
        run: ./gradlew clean bootJar -x test

      - name: Copy JAR and Dockerfile to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar,Dockerfile"
          target: "~/yomu-autentikasi"

      - name: Build and Run Docker on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +H

            cd ~/yomu-autentikasi

            echo "Stopping old container..."
            sudo docker stop yomu-autentikasi || true
            sudo docker rm yomu-autentikasi || true

            echo "Removing old image..."
            sudo docker rmi yomu-autentikasi:latest || true

            echo "Building new Docker image..."
            sudo docker build -t yomu-autentikasi:latest .

            echo "Running new container..."
            sudo docker run -d \
              --name yomu-autentikasi \
              -p 8081:8081 \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
              -e SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
              --restart unless-stopped \
              yomu-autentikasi:latest

            echo "Deployment completed successfully!"
